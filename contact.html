<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact | Molar & Mint</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><div class="wrap" style="display:flex;align-items:center;justify-content:space-between;width:100%"><a class="brand" href="index.html"><span class="brand-mark">✦</span><span>Molar & Mint<small>Dental Studio</small></span></a><nav class="nav"><a href="index.html">Home</a><a href="services.html">Treatments</a><a href="clinics.html">Find a Clinic</a><a class="btn" href="clinics.html">Book Appointment</a></nav></div></header><section class="page-hero"><div class="wrap"><span class="eyebrow">Contact</span><h1 style="font-size:clamp(2rem,3.5vw,3.2rem)">We'd love to hear from you.</h1><p>Use this demo enquiry form to preview the contact experience.</p></div></section><main class="section"><div class="wrap" style="max-width:680px"><form class="panel" id="contactForm"><div class="form-grid"><label class="field-wrap">Your name<input required placeholder="Full name"></label><label class="field-wrap">Email<input type="email" required placeholder="you@example.com"></label><label class="field-wrap full">What can we help with?<select><option>Appointment question</option><option>Clinic listing</option><option>General enquiry</option></select></label><label class="field-wrap full">Message<textarea rows="4" required placeholder="Write your message..."></textarea></label></div><button class="btn" style="margin-top:16px">Send demo enquiry</button><p id="contactMessage" class="toast hidden" style="margin-top:12px">Thanks — this demo form does not send messages to a server.</p></form></div></main><script>document.querySelector('#contactForm').addEventListener('submit',e=>{e.preventDefault();document.querySelector('#contactMessage').classList.remove('hidden')})</script><script src="app.js"></script></body></html>
